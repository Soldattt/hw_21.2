<!doctype html>
<html lang="ru">

            </div>
            </div>

            </div>
            <a class="nav-link mt-4 ms-4" href="#">Главная</a>

            <div class="dropdown  m-5 ">

            </ul>

                <textarea class="form-control" placeholder="Сообщение" rows="3"></textarea>
              </div>
              <button type="submit" class="btn btn-primary ">Отправить</button>
              </div>
            <div class="col-6">
              <div class="card" style="width: width: 3rem; height: 25rem">
              <div class="card-body">
                <h3 class="card-title ">Наши контакты</h3>

            </div>
            </div>
            </div>
